[project]
name = "mutr-web-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "mutr-core",
]

[tool.uv.sources]
mutr-core = { path = "../../mutr_core", editable = true }

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
