worker_processes auto;

error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    sendfile_max_chunk 256k;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 0;
    server_tokens off;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log logs/access.log combined buffer=32k flush=5s;

    types {
        audio/flac flac;
        audio/wav wav;
        audio/aac aac;
    }

    server {
        listen 127.0.0.1:8000;
        server_name localhost;

        root /home/vahan/src/mutr-web/web/dist;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /media/ {
            alias /home/vahan/src/mutr-web/server/data/projects/;
            sendfile on;
            tcp_nopush on;
            add_header Accept-Ranges bytes;
        }

        location /api/ {
            proxy_pass http://unix:/home/vahan/src/mutr-web/server/mutr.sock;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
